# Build -> push -> migrate -> roll out. Triggered on merge to main.
# Infra changes go through `terraform plan/apply`; this pipeline only ships new images.
substitutions:
  _REGION: us-central1
  _REPO: riverbend
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/console:$SHORT_SHA
steps:
  - id: test
    name: ghcr.io/astral-sh/uv:0.13.0-python3.12-bookworm
    entrypoint: bash
    args: ["-c", "apt-get update -qq && apt-get install -y -qq postgresql >/dev/null && uv sync --frozen && uv run pytest -q"]
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:$SHORT_SHA", "."]
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:$SHORT_SHA"]
  - id: build-console
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/console:$SHORT_SHA", "ui"]
  - id: push-console
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/console:$SHORT_SHA"]
  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run jobs update riverbend-migrate --region ${_REGION} \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:$SHORT_SHA
        gcloud run jobs execute riverbend-migrate --region ${_REGION} --wait
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        for svc in riverbend-worker riverbend-api; do
          gcloud run services update $svc --region ${_REGION} \
            --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:$SHORT_SHA
        done
        # The console ships independently: its own image, its own service, its own rollback.
        gcloud run services update riverbend-console --region ${_REGION} \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/console:$SHORT_SHA
